name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate skills, commands, agents and evals
        run: python scripts/validate.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint install script
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh

  # Every push to main that passes the checks becomes a release 0.MINOR.PATCH.
  # The bump is MINOR by default; put [patch] in a commit subject since the
  # last release for a PATCH bump (scripts/next_release.py). dev has no tags
  # and no releases.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the build and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag=$(python3 scripts/next_release.py --notes notes.md)
          if [ -z "$tag" ]; then
            echo "A release already contains HEAD; nothing to do"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "released $tag"
